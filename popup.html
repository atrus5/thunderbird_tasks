<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Perch Task Board</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="pop-header">
    <img src="icons/icon.svg" alt="" width="18" height="18">
    <strong>Perch Task Board</strong>
    <span id="counts" class="counts"></span>
  </header>

  <form id="quickAdd" class="quick-add">
    <input id="qTitle" type="text" placeholder="Quick add a task&hellip;" maxlength="200" autocomplete="off">
    <input id="qDue" type="date" title="Due date (optional)">
    <button type="submit" class="btn primary" title="Add task">+</button>
  </form>

  <button id="fromEmailBtn" class="btn from-email hidden" type="button">
    &#9993; New task from this email
  </button>

  <ul id="dueList" class="due-list"></ul>

  <div id="emptyHint" class="empty-hint hidden">Nothing due in the next 7 days.</div>

  <footer class="pop-footer">
    <button id="openBoardBtn" class="btn primary wide" type="button">Open board</button>
  </footer>

  <div id="status" class="status"></div>

  <script src="dev_shim.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
